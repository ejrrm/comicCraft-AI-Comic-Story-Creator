<!doctype html><html><head><meta charset="utf-8"><title>ComicCraft AI</title><link rel="stylesheet" href="/static/css/style.css"></head><body>
<main class="container"><header><h1>🎨 ComicCraft AI</h1><p>Turn your idea into a five-panel comic.</p></header>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form action="/generate" method="post" class="card">
<label>Story Prompt<textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea></label>
<label>Main Character Name<input name="character_name" required value="Alex"></label>
<label>Setting<select name="setting"><option>forest</option><option>school</option><option>space</option><option>city</option></select></label>
<label>Story Tone<select name="tone"><option>light-hearted</option><option>dramatic</option><option>poetic</option><option>funny</option></select></label>
<label>Art Style<select name="art_style"><option>anime</option><option>pixel art</option><option>comic book</option><option>realistic</option></select></label>
<button type="submit">✨ Generate Comic</button></form>
<section class="info"><b>Pipeline:</b> Outline → Story & Dialogue → Illustrations → Layout → PDF</section></main></body></html>
